name: Deploy to Production

# Triggers when a PR is merged into main
on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Migrate DB + Deploy Edge Functions (Production)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      # ── 1. Install Supabase CLI ─────────────────────────────
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # ── 2. Link to production project ──────────────────────
      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.PROD_SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # ── 3. Run pending migrations ───────────────────────────
      - name: Push database migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # ── 4. Set Edge Function secrets ───────────────────────
      - name: Set function secrets
        run: |
          supabase secrets set \
            CLICKSEND_USERNAME="${{ secrets.CLICKSEND_USERNAME }}" \
            CLICKSEND_API_KEY="${{ secrets.CLICKSEND_API_KEY }}" \
            CLICKSEND_FROM="${{ secrets.CLICKSEND_FROM }}" \
            OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # ── 5. Deploy all Edge Functions ────────────────────────
      - name: Deploy create-reminder
        run: supabase functions deploy create-reminder --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy send-reminders
        run: supabase functions deploy send-reminders --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy transcribe
        run: supabase functions deploy transcribe --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

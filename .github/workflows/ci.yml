name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging]

jobs:
  # ── 1. Lint ────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

  # ── 2. Unit tests (no Supabase needed) ────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        # tests/unit/ only — no database required
        run: npm test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ── 3. Typecheck Edge Functions (Deno) ─────────────────────
  typecheck-functions:
    name: Typecheck Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Check create-reminder
        run: deno check supabase/functions/create-reminder/index.ts

      - name: Check send-reminders
        run: deno check supabase/functions/send-reminders/index.ts

      - name: Check transcribe
        run: deno check supabase/functions/transcribe/index.ts

      # Deno unit tests for Edge Functions
      # Uncomment this block once index.test.ts files are added:
      #
      # - name: Deno unit tests
      #   run: deno test supabase/functions/ --allow-env
      #   env:
      #     SUPABASE_URL: http://127.0.0.1:54321
      #     SUPABASE_SERVICE_ROLE_KEY: placeholder
      #     CLICKSEND_USERNAME: placeholder
      #     CLICKSEND_API_KEY: placeholder
      #     CLICKSEND_FROM: placeholder
      #     OPENAI_API_KEY: placeholder

